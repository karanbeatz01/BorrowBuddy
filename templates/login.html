{% extends "base.html" %}

{% block title %}Log in · BorrowBuddy{% endblock %}

{% block content %}
<section class="form-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Log in</h1>
    <p class="form-intro">Pick up where your campus community left off.</p>
    <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="identity">Username or email</label>
        <input id="identity" name="identity" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password"
                   data-password-input required>
            <button class="password-toggle" type="button" data-password-toggle
                    aria-label="Show password" aria-pressed="false">Show</button>
        </div>

        <button class="button button-primary button-full" type="submit">Log in</button>
    </form>
    <p class="form-switch">New to BorrowBuddy? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
