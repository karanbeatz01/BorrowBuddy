{% extends "base.html" %}

{% block title %}Page not found · BorrowBuddy{% endblock %}

{% block content %}
<section class="error-card">
    <p class="eyebrow">404 · Not found</p>
    <h1>We couldn’t find that page</h1>
    <p>The page or item may have moved, or the address may be incorrect.</p>
    <a class="button button-primary" href="{{ url_for('browse') }}">Browse items</a>
</section>
{% endblock %}
